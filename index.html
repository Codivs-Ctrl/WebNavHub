<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodiFelix NavHub 导航主页</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { 
            --accent: #8ab4f8; 
            --bg-glass: rgba(255,255,255,0.12);
            --icon-shadow: 0 6px 14px rgba(0,0,0,0.45);
            --icon-shadow-hover: 0 6px 14px rgba(0,0,0,0.45);
            --text-color: #fff;
        }
        body {
            margin: 0; padding: 0; font-family: "Segoe UI", sans-serif;
            background: #202124 url('image0.webp') no-repeat center center fixed;
            background-size: cover;
            color: #fff; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; transition: 0.3s; overflow-y: auto;
        }
        .top-bar { position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 100; }
        button, .btn-label {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; backdrop-filter: blur(10px); font-size: 13px;
        }
        .search-area { 
                      margin-top: 3vh;
                      width: 90%; 
                      max-width: 720px;
                      text-align: center; 
                    }
        #logo { 
            font-size: 70px; 
            font-weight: bold; 
            margin-bottom: 35px;
            letter-spacing: -3px;
        }
        .input-group {
            display: flex; background: white; border-radius: 30px; padding: 5px 15px;
            align-items: center; box-shadow: 0 4px 25px rgba(0,0,0,0.5);
        }
        select { border: none; background: none; font-weight: bold; padding: 10px; color: #444; outline: none; cursor: pointer; }
        #search-input { flex: 1; border: none; outline: none; padding: 12px; font-size: 16px; color: #000; }
        .container { width: 95%; max-width: 1100px; margin-top: 40px; padding-bottom: 50px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(8, 1fr); 
            gap: 12px; 
            margin-bottom: 40px; 
            perspective: none;
        }
        @media (max-width: 950px) {
            #memo-container {
                margin-top: 150px !important; 
                transition: 0.3s;
                }
            .grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 730px) {
            .top-bar { 
                 position: relative !important; 
                 top: 0 !important; 
                 right: 0 !important; 
                 padding: 10px; 
                 justify-content: center; 
                 flex-wrap: wrap; 
                 background: rgba(0,0,0,0.2); 
                 margin-bottom: 10px;
                }
             .welcome-box { 
                 position: relative !important; 
                 top: 0 !important; 
                 left: 0 !important; 
                 margin: 10px 0 10px 20px !important; 
                }
            #memo-container {
                margin-top: 10px !important; 
                }
            #memo-input {
                min-height: 90px !important;
                max-height: 200px !important;
                }
            .search-area {
                width: 95% !important; 
                margin: 20px auto !important; 
                }
            .input-group {
                width: 100% !important;
                box-sizing: border-box;
                padding: 10px 15px !important; 
                }
            #search-input {
                width: 10px;
                font-size: 16px !important; 
                padding: 10px !important; 
                font-weight: 500 !important;
                }
            select {
                padding: 5px 2px 5px 8px !important;
                font-size: 13px !important;
                max-width: 95px !important;
                min-width: 75px !important;
                background-position: right 2px center;
                }
            #logo { 
                font-size: 45px !important;
                margin-bottom: 25px !important;
                line-height: 1.2 !important;
                height: auto !important;
                display: block !important;
                }
            .grid { 
                grid-template-columns: repeat(3, 1fr); 
                gap: 8px; 
                }
            #memo-input {
                background: rgba(255, 255, 255, 0.1) !important; 
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                }
            .grid a {
                display: flex !important;
                flex-direction: column;
                align-items: center;
                width: 100%;
                text-decoration: none;
                -webkit-tap-highlight-color: rgba(0,0,0,0);
                }
            .card {
                -webkit-touch-callout: none !important; 
                -webkit-user-select: none !important;
                user-select: none !important;
                touch-action: pan-y !important; 
                -webkit-user-drag: none !important;
                }
            .edit-mode .card {
                border: 1px dashed rgba(255,255,255,0.3);
                border-radius: 8px;
                cursor: move !important;
                touch-action: none !important;
                }
            .signature-fixed { display: none; } 
        }
        .grid img {
            -webkit-user-drag: none !important;
            pointer-events: none !important;
            }
        .sortable-ghost {
            opacity: 0.4;
            background: var(--accent) !important;
            }
        @media (hover: none) and (pointer: coarse) {
            .grid > a {
                transition: none;
            }
            .grid > a:active {
                transform: none;
                filter: none;
            }
            .grid > a:active .icon-circle {
                transform: none;
                box-shadow: var(--icon-shadow);
            }
        }
        .card { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            text-decoration: none; 
            color: white; 
            cursor: default;
            width: 100%;
            height: 120px; 
            justify-content: center;
            transform-style: flat;
            transition: none;
        }
        .icon-circle { 
            width: 48px; 
            height: 48px; 
            border-radius: 50%;
            background: var(--bg-glass);
            backdrop-filter: blur(6px);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 8px; 
            overflow: hidden; 
            pointer-events: auto !important;
            cursor: pointer !important;
            transform: none;
            box-shadow: var(--icon-shadow);
            transition: background 0.2s ease;
        }
        .icon-circle:hover {
            background: rgba(255,255,255,0.18) !important;
        }
        .icon-circle img { width: 24px; height: 24px; }
        .edit-btns { position: absolute; top: -8px; right: 8px; display: none; z-index: 10; gap: 3px; }
        .edit-mode .edit-btns { display: flex; }
        .btn-sm { width: 20px; height: 20px; border-radius: 50%; border: none; color: white; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-del { background: #ff4d4d; }
        .btn-edit { background: #fbbc05; color: #000; }
        .btn-pin { background: #34a853; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #2d2e31; padding: 25px; border-radius: 15px; width: 340px; border: 1px solid #444; }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box; }
        .hidden { display: none; }
        .signature-fixed {
            position: fixed;
            top: 65px;
            right: 20px;
            z-index: 99;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            }
        .welcome-box {
            position: fixed;
            top: 20px;
            left: 25px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            }
        #auto-device-info {
            white-space: pre-line;
            line-height: 1.5;
            font-size: 11px;
            color: #4a90e2;
            font-family: "Consolas", monospace;
            opacity: 1;
            letter-spacing: 0.2px;
            }
        #copy-btn:hover, #clear-btn:hover {
            color: #8ab4f8 !important;
            opacity: 1;
        }
        #pub-ip {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            font-family: "Consolas", monospace;
            line-height: 1.5;
            }
        #search-history-area {
            margin-top: 30px;
            }
        #history-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 10px 20px;
            max-height: 450px;
            overflow-y: auto;
            padding: 10px;
            }
        #history-list::-webkit-scrollbar {
            width: 6px;
            }
        #history-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            }
        .history-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: auto; 
            min-width: 90px; 
            margin: 0 15px 15px 15px; 
            flex-shrink: 0;
            }
        .history-click-zone {
            cursor: pointer !important;
            user-select: none;
            }
        .history-icon-circle {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            transition: none;
            }
        .history-click-zone:hover .history-icon-circle {
            background: rgba(255, 255, 255, 0.08);
            }
        .history-text-selectable {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            text-align: center;
            width: 100%;
            display: block;
            margin-top: 10px;
            white-space: normal;
            word-break: break-all;
            cursor: text;
            user-select: text;
        }
        .grid > .card:hover {
            transform: none;
            filter: none;
        }
        .edit-mode .grid > .card:hover {
            transform: none !important;
            filter: none !important;
        }
        .grid > .card:hover .icon-circle {
            transform: none;
            box-shadow: var(--icon-shadow);
        }
        /* 主题模式 */
        body.dark {
            --bg-glass: rgba(255,255,255,0.12);
            --icon-shadow: 0 6px 14px rgba(0,0,0,0.45);
            --icon-shadow-hover: 0 6px 14px rgba(0,0,0,0.45);
            --text-color: #fff;
        }
        body.light {
            --bg-glass: rgba(255,255,255,0.65);
            --icon-shadow: 0 6px 14px rgba(0,0,0,0.18);
            --icon-shadow-hover: 0 6px 14px rgba(0,0,0,0.18);
            --text-color: #111;
        }
        .grid > .card {
            color: var(--text-color);
        }
        /* 编辑模式强制禁用呼吸动画 */
        .edit-mode .icon-circle {
            animation: none !important;
            filter: none !important;
        }
        /* 卡片内容区域样式 */
        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            cursor: default;
            padding: 0 4px;
        }
        /* 修复模态框按钮可点击性 */
        .modal-content button {
            pointer-events: auto !important;
            z-index: 1001 !important;
        }
        /* 文字区域基础样式 */
        .site-name-text {
            font-size: 12px;
            line-height: 1.4;
            height: 40px;
            text-align: center;
            overflow: hidden;
            padding: 0 2px;
            width: 100%;
            box-sizing: border-box;
            display: block;
        }
    </style>
</head>
<body>
<div class="welcome-box">
        <!-- 返回首页按钮 -->
    <a href="https://www.firegle.com" style="display: inline-block; font-size: 16px; font-weight: bold; color: inherit; text-decoration: none; color: #ff6700;">点击 进入夏晴烈首页</a>
    <div style="font-size: 24px; font-weight: bold; color: white; margin-bottom: 5px;">Hi, CodiFelix NavHub</div>
    <div id="auto-device-info">
        SYST: 获取中...
    </div>
    <div id="pub-ip">
        IP: 正在获取...
    </div>
</div>

<div class="signature-fixed" style="font-size: 14px; opacity: 0.8;">“ 生活明朗，万物可爱 ”</div>
<div id="memo-container" style="margin: 40px auto 0; width: 95%; max-width: 600px;">
    <div style="display: flex; align-items: center; margin-bottom: 8px;">
        <span style="font-size: 14px; color: #8ab4f8; font-weight: bold; opacity: 0.8; white-space: nowrap;">📝 备忘录</span>
        <span id="save-status" style="font-size: 12px; opacity: 0; transition: 0.3s; color: #34a853; margin-left: 10px; white-space: nowrap;">已存入</span>
    </div>
    <textarea id="memo-input" placeholder="点击这里开始记录...  内容会自动保存.. 或 点击发送到邮箱..&#10;注意以下几点会导致内容消失：&#10;清理浏览器缓存; 多标签页会导致内容被覆盖&#10;系统磁盘清理; 浏览器升级/重装"
        style="width: 100%; min-height: 90px; max-height: 200px; background: rgba(255,255,255,0.1) !important; border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 12px; color: #fff; padding: 15px; outline: none; resize: none; font-size: 14px; line-height: 1.6; overflow-y: auto;"></textarea>
    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 0px; padding-right: 0px; font-size: 11px; color: rgba(255,255,255,0.3);">
        <span id="resend-btn" style="cursor: pointer; display: flex; align-items: center; gap: 3px; transition: 0.2s;">✉️ 发送到邮箱</span>
        <span id="copy-btn" style="cursor: pointer; display: flex; align-items: center; gap: 3px; transition: 0.2s;">📋 复制</span>
        <span id="clear-btn" style="cursor: pointer; display: flex; align-items: center; gap: 3px; transition: 0.2s;">🗑️ 清空</span>
    </div>
</div>

<div class="top-bar">
    <button onclick="openSiteModal()">+ 添加站点</button>
    <button onclick="openModal('bg-modal')">🖼️ 背景</button>
    <button onclick="exportData()">💾 备份</button>
    <button onclick="document.getElementById('import-file').click()">📂 恢复</button>
    <input type="file" id="import-file" class="hidden" onchange="importData(event)">
    <button onclick="toggleEdit()" id="edit-toggle-btn">⚙️ 管理</button>
</div>
<div id="site-modal" class="modal">
    <div class="modal-content">
        <h3 id="modal-title">快捷方式</h3>
        <input type="hidden" id="edit-id">
        <input type="text" id="site-name" placeholder="名称">
        <input type="text" id="site-url" placeholder="网址">
        <input type="text" id="site-icon" placeholder="图标URL (可选)">
        <input type="text" id="site-remark" placeholder="备注（鼠标悬停显示，可选）">
        <div style="text-align:right; margin-top: 20px;">
            <button onclick="closeModal('site-modal')" style="padding: 8px 20px; margin-right: 10px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; cursor: pointer;">取消</button>
            <button onclick="saveSite()" style="background:var(--accent); color:#000; padding:8px 20px; border-radius:5px; font-weight:bold; cursor: pointer;">确定</button>
        </div>
    </div>
</div>
<div id="bg-modal" class="modal">
    <div class="modal-content">
        <h3>背景设置</h3>
        <label class="btn-label" style="display:block; text-align:center; margin-bottom:15px;">📁 本地上传<input type="file" id="bg-file" class="hidden" onchange="uploadLocalBg()"></label>
        <input type="text" id="bg-url-input" placeholder="网络图片URL (回车)" onkeypress="if(event.keyCode==13) setNetBg()">
        <input type="color" id="bg-color-pick" style="width:100%; height:40px;" onchange="setSolidBg()">
        <button onclick="resetBg()" style="width:100%; margin-top:10px; background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.2); padding:8px; border-radius:5px;">♻️ 恢复默认背景</button>
        <div style="text-align:right; margin-top:15px;">
            <button onclick="closeModal('bg-modal')" style="background:none; border:none; color:#fff;">关闭</button>
        </div>
    </div>
</div>
<div class="search-area">
    <div id="logo">Google</div>
    <div class="input-group">
        <select id="engine" onchange="updateUI()" style="font-size: 16px;">
            <option value="google">🥳 <span style="font-size: 14px;">Google</span></option>
            <option value="bing">🐸 <span style="font-size: 14px;">Bing</span></option>
            <option value="baidu">🐾 <span style="font-size: 14px;">Baidu</span></option>
        </select>
        <input type="text" id="search-input" placeholder="回车搜索 ( Alt + S 键切换搜索引擎 )" autofocus onkeypress="if(event.keyCode==13) doSearch()">
    </div>
</div>
<div class="container">
    <h4 style="border-left:4px solid var(--accent); padding-left:10px; margin-bottom:20px;">快捷导航</h4>
    <div class="grid" id="site-list"></div>

    <div id="search-history-area" style="display:none; margin-top: 30px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px;">
            <h4 style="border-left:4px solid #ffcc00; padding-left:10px; margin:0;">最近搜索</h4>
            <a href="javascript:void(0);" onclick="clearHistory()" style="font-size: 13px; color: #ff4d4d; text-decoration: none; cursor: pointer !important;">清空全部</a>
        </div>
        <div class="grid" id="history-list"></div>
    </div>
</div>

<script>
    // 全局常量定义
    const engines = {
        google: { 
            url: "https://www.google.com/search?q=", 
            color: "#4285f4", 
            name: "Google",
            logoIcon: "google-brand-color.webp"
        },
        bing: { 
            url: "https://www.bing.com/search?q=",
            color: "#00809d", 
            name: "Bing",
            logoIcon: "BingOct2020logo.svg"
        },
        baidu: { 
            url: "https://www.baidu.com/s?wd=",
            color: "#ff2d46", 
            name: "Baidu",
            logoIcon: "baidu-brand-color.webp"
        }
    };
    const engineKeys = ['google', 'bing', 'baidu'];
    const STORAGE_KEY = 'cfg_vfinal_memo';
    const USAGE_KEY = 'nav_usage_map';
    
    // ========== 工具函数：截断文字为2行 ==========
    function truncateText(text, maxLines = 1, maxLengthPerLine = 16) {
        const maxTotalLength = maxLines * maxLengthPerLine;
        if (text.length <= maxTotalLength) return text;
        
        // 截断后添加省略号
        return text.slice(0, maxTotalLength) + '...';
    }
    
    // ========== 使用频率统计核心逻辑 ==========
    let usageMap = JSON.parse(localStorage.getItem(USAGE_KEY) || '{}');

    // 保存使用统计到本地存储
    function saveUsage() {
        localStorage.setItem(USAGE_KEY, JSON.stringify(usageMap));
    }

    // 移除呼吸高亮效果函数（不再需要）
    function applyUsageHighlight() {
        return;
    }

    // 绑定点击事件统计使用次数（只绑定图标）
    function bindUsageClickEvent() {
        document.querySelectorAll('#site-list .icon-circle').forEach(icon => {
            const card = icon.closest('.card');
            if (!card) return;
            
            const id = card.getAttribute('data-id');
            const sites = JSON.parse(localStorage.getItem('cfg_vfinal_sites')) || [];
            const site = sites.find(s => s.id == id);
            
            if (site && site.url) {
                icon.addEventListener('click', () => {
                    usageMap[site.url] = (usageMap[site.url] || 0) + 1;
                    saveUsage();
                });
            }
        });
    }

    // ========== 核心功能函数 ==========
    function setEngine(v) { 
        document.getElementById('engine').value = v; 
        updateUI(); 
    }

    // 打开模态框（修复：重写事件绑定逻辑）
    function openModal(id) {
        const modal = document.getElementById(id);
        if (!modal) return;
        
        modal.style.display = 'flex';
        modal.onclick = null;
        
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal(id);
            }
        }, { once: true });
    }

    // 关闭模态框
    function closeModal(id) {
        const modal = document.getElementById(id);
        if (!modal) {
            console.error('模态框不存在：', id);
            return;
        }
        modal.style.display = 'none';
        
        if (id === 'site-modal') {
            const editIdInput = document.getElementById('edit-id');
            const siteName = document.getElementById('site-name');
            const siteUrl = document.getElementById('site-url');
            const siteIcon = document.getElementById('site-icon');
            const siteRemark = document.getElementById('site-remark');
            
            if (editIdInput) editIdInput.value = '';
            if (siteName) siteName.value = '';
            if (siteUrl) siteUrl.value = '';
            if (siteIcon) siteIcon.value = '';
            if (siteRemark) siteRemark.value = '';
        }
    }

    function uploadLocalBg() {
        const file = document.getElementById('bg-file').files[0];
        const reader = new FileReader();
        reader.onloadend = () => applyBg(reader.result, 'img');
        if(file) reader.readAsDataURL(file);
    }

    function setNetBg() { 
        applyBg(document.getElementById('bg-url-input').value, 'img'); 
    }

    function setSolidBg() { 
        applyBg(document.getElementById('bg-color-pick').value, 'color'); 
    }

    function doSearch() {
        const type = document.getElementById('engine').value;
        const inputEl = document.getElementById('search-input');
        const kw = inputEl.value.trim();
        if(!kw) return;
        
        let hist = JSON.parse(localStorage.getItem('cfg_vfinal_hist')) || [];
        hist = hist.filter(item => item.name !== kw);
        hist.unshift({ 
            id: Date.now(), 
            name: kw, 
            url: engines[type].url + encodeURIComponent(kw) 
        });
        localStorage.setItem('cfg_vfinal_hist', JSON.stringify(hist.slice(0, 100)));
        renderHistory();
        
        const targetUrl = engines[type].url + encodeURIComponent(kw);
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
            window.location.href = targetUrl;
        } else {
            window.open(targetUrl, '_blank');
        }
    }

    function saveSearch(kw) {
        let hist = JSON.parse(localStorage.getItem('cfg_vfinal_hist')) || [];
        hist = hist.filter(item => item.name !== kw);
        hist.unshift({ id: Date.now(), name: kw });

        const siteName = document.getElementById('site-name');
        const siteUrl = document.getElementById('site-url');
        const siteIcon = document.getElementById('site-icon');
        const siteRemark = document.getElementById('site-remark');

        if (!url) {
            alert('请输入站点网址');

            return;
        }

        if (!/^https?:\/\//i.test(url)) {
            url = 'https://' + url;
        }

            sites = JSON.parse(localStorage.getItem('cfg_vfinal_sites') || '[]');

            console.error('本地站点数据损坏，已重置', e);

            id: editId ? parseInt(editId) : Date.now(),

            url: url,
            icon: siteIcon.value.trim(),

                sites[idx] = siteData;

    function initSortable() {
        const el = document.getElementById('site-list');
        if (!el) return;
        
        const isEditMode = document.body.classList.contains('edit-mode');
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        if (window.sortableInstance) {
            window.sortableInstance.destroy();
        }
        
        window.sortableInstance = Sortable.create(el, {
            animation: 0,
            disabled: isMobile ? !isEditMode : false, 
            delay: isMobile ? 200 : 100,
            delayOnTouchOnly: true,
            touchStartThreshold: 20,
            onEnd: function() {
                let newOrder = []; 
                const sites = JSON.parse(localStorage.getItem('cfg_vfinal_sites')) || [];
                
                document.querySelectorAll('#site-list .card').forEach(card => {
                    const id = card.getAttribute('data-id');
                    const site = sites.find(s => s.id == id);
                    if(site) newOrder.push(site);

                localStorage.setItem('cfg_vfinal_sites', JSON.stringify(newOrder));
            }
        });
    }

    async function getDeviceInfo() {
        const el = document.getElementById('auto-device-info');
        const memoInput = document.getElementById('memo-input');
        if (!el) return;

        const ua = navigator.userAgent;
        const platform = navigator.platform;
        let osDisplay = "OtherOS";

        if (ua.includes("Win")) {
            osDisplay = "Windows";
        } else if (ua.includes("Android")) {
            osDisplay = "Android";
        } else if (ua.includes("iPad") || (platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
            osDisplay = "iPad";
        } else if (ua.includes("Mac")) {
            osDisplay = "Mac";
        } else if (ua.includes("Linux")) {
            osDisplay = "Linux";
        }

        let loadTime = "测速中";
        const nav = performance.getEntriesByType("navigation")[0];

        if (nav) {
            if (nav.loadEventEnd > 0) {
                loadTime = Math.round(nav.loadEventEnd);
            } else if (nav.responseEnd > 0) {
                loadTime = Math.round(nav.responseEnd);
            }
        }

        const renderAll = (batteryStr = window.lastBattery || "") => {
            const wordCount = memoInput ? memoInput.value.length : 0;
            el.textContent =
                `SYST: ${osDisplay}${batteryStr}\n` +
                `⏱️延时 ${loadTime}ms | 📝 ${wordCount}字`;
        };

        if (navigator.getBattery) {
            try {
                const battery = await navigator.getBattery();
                const update = () => {
                    window.lastBattery =
                        ` | ${battery.charging ? "⚡" : "🔋"} ${Math.floor(battery.level * 100)}%`;
                    renderAll();
                };
                update();
                battery.onlevelchange = update;
                battery.onchargingchange = update;
            } catch (e) {
                renderAll();
            }
        } else {
            renderAll();
        }

        window.refreshDeviceInfo = renderAll;
    }

    function manageMemo() {
        const memoInput = document.getElementById('memo-input');
        const saveStatus = document.getElementById('save-status');
        const copyBtn = document.getElementById('copy-btn');
        const clearBtn = document.getElementById('clear-btn');
        const resendBtn = document.getElementById('resend-btn');

        const EMAILJS_PUBLIC_KEY = '3P1oxXvgHXRlgdSHu'; 
        const EMAILJS_SERVICE_ID = 'service_erqf5v7';     
        const EMAILJS_TEMPLATE_ID = 'template_9hmy1gr';   
        const TARGET_EMAIL = '7533153@qq.com';

        function formatDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hour = String(now.getHours()).padStart(2, '0');
            const minute = String(now.getMinutes()).padStart(2, '0');
            const second = String(now.getSeconds()).padStart(2, '0');
            return `${year}年${month}月${day}日 ${hour}:${minute}:${second}`;
        }

        async function sendToEmail() {
            const content = memoInput.value.trim();
            if (!content) {
                alert('暂无内容可发送，请先输入备忘录内容！');
                return;
            }
        
            resendBtn.textContent = '✉️ 发送中...';
            resendBtn.disabled = true;
            resendBtn.style.cursor = 'not-allowed';
        
            try {
                const response = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        service_id: EMAILJS_SERVICE_ID,
                        template_id: EMAILJS_TEMPLATE_ID,
                        user_id: EMAILJS_PUBLIC_KEY,
                        template_params: {
                            memo_content: content,
                            subject: '备忘录内容备份',
                            datetime: formatDateTime(),
                            to_email: TARGET_EMAIL
                        }
                    })
                });
            
                const responseText = await response.text();
                if (response.ok && responseText === 'OK') {
                    alert('✅ 备忘录已发送到邮箱！');
                } else {
                    throw new Error(responseText || `请求失败（状态码：${response.status}）`);
                }
            
            } catch (error) {
                console.error('发送失败详情：', error);
                alert(`❌ 发送失败：${error.message.substring(0, 100)}`);
            } finally {
                resendBtn.textContent = '✉️ 发送到邮箱';
                resendBtn.disabled = false;
                resendBtn.style.cursor = 'pointer';
            }
        }

        if (resendBtn) {
            resendBtn.addEventListener('click', sendToEmail);
        }

        const rawData = localStorage.getItem(STORAGE_KEY);
        if (rawData && memoInput) {
            try {
                const data = JSON.parse(rawData);
                memoInput.value = (typeof data === 'object' && data.content !== undefined) ? data.content : rawData;
            } catch (e) { 
                memoInput.value = rawData; 
            }
        }

        let timer;
        if (memoInput) {
            memoInput.addEventListener('input', () => {
                if (saveStatus) saveStatus.style.opacity = 1;
                if (window.refreshDeviceInfo) window.refreshDeviceInfo();
                
                clearTimeout(timer);
                timer = setTimeout(() => {
                    const memoObj = {
                        content: memoInput.value,
                        lastModified: new Date().toISOString()
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(memoObj));
                    
                    if (saveStatus) {
                        setTimeout(() => { 
                            saveStatus.style.opacity = 0; 
                        }, 1500);
                    }
                }, 800);
            });
        }

        if (copyBtn) {
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(memoInput.value).then(() => {
                    const oldText = copyBtn.innerText;
                    copyBtn.innerText = "✅ 已复制";
                    setTimeout(() => { 
                        copyBtn.innerText = oldText; 
                    }, 2000);
                });
            };
        }

        if (clearBtn) {
            clearBtn.onclick = () => {
                if (confirm("确定要清空备忘录吗？此操作不可撤销。")) {
                    memoInput.value = "";
                    localStorage.removeItem(STORAGE_KEY);
                    if (window.refreshDeviceInfo) window.refreshDeviceInfo();
                }
            };
        }
    }

    // 导入数据
    function importData(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function() {
            try {
                const data = JSON.parse(reader.result);
                if(data.sites) localStorage.setItem('cfg_vfinal_sites', data.sites); 
                if(data.bg) localStorage.setItem('cfg_vfinal_bg', data.bg); 
                if(data.bgType) localStorage.setItem('cfg_vfinal_bg_type', data.bgType);
                if(data.history) localStorage.setItem('cfg_vfinal_hist', data.history); 
                if(data.memo) {
                    if (data.memo.includes('"content":')) {
                        localStorage.setItem(STORAGE_KEY, data.memo); 
                    } else {
                        const wrapMemo = {
                            content: data.memo,
                            lastModified: new Date().toISOString()
                        };
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(wrapMemo));
                    }
                }
                alert("✅ 所有配置同步成功！");
                location.reload();
            } catch(err) { 
                alert("❌ 导入失败：文件格式不正确"); 
            }
        };
        reader.readAsText(file);
    }

            const btnHtml = isFixed ? '' : `

    // 应用背景
    function applyBg(value, type) {
        const body = document.body;
        if (type === 'img') {
            body.style.background = `#202124 url('${value}') no-repeat center center fixed`;
            body.style.backgroundSize = 'cover';
        } else if (type === 'color') {
            body.style.background = value;
            body.style.backgroundSize = 'auto';
        }
        localStorage.setItem('cfg_vfinal_bg', value);
        localStorage.setItem('cfg_vfinal_bg_type', type);
    }

    // ========== 页面初始化 ==========
    document.addEventListener('DOMContentLoaded', () => {
        getDeviceInfo();
        manageMemo();
        refreshPublicIP();
        
        const bg = localStorage.getItem('cfg_vfinal_bg');
        const type = localStorage.getItem('cfg_vfinal_bg_type');
        if (bg) {
            applyBg(bg, type);
        }
        
        updateUI();
        render();
        renderHistory();
        
        document.addEventListener('keydown', e => {
            if (e.altKey && e.key.toLowerCase() === 's') {
                e.preventDefault();
                const currentEngine = document.getElementById('engine').value;
                let nextIndex = (engineKeys.indexOf(currentEngine) + 1) % engineKeys.length;
                setEngine(engineKeys[nextIndex]);
            }
        });
    });
